name: Build TensorFlow GPU Wheel (Python 3.9)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-wheel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout TensorFlow source
        uses: actions/checkout@v4
        with:
          repository: tensorflow/tensorflow
          ref: r2.15

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip python3-venv \
            build-essential zip unzip curl git \
            pkg-config libc6-dev libnccl2 libnccl-dev \
            libssl-dev libffi-dev

      - name: Install Bazelisk
        run: |
          sudo wget -O /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          sudo ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Install Python deps
        run: |
          pip install --upgrade pip numpy wheel packaging

      - name: Install CUDA Toolkit
        run: |
          sudo apt-get install -y nvidia-cuda-toolkit
          nvcc --version || true

      - name: Configure TensorFlow
        run: |
          cat <<EOF | ./configure
          /opt/hostedtoolcache/Python/3.9*/x64/bin/python3
          Y
          /usr
          /usr
          8.9
          EOF

      - name: Build TensorFlow GPU
        run: |
          bazel build --config=opt --config=cuda \
            //tensorflow/tools/pip_package:build_pip_package

      - name: Build wheel package
        run: |
          ./bazel-bin/tensorflow/tools/pip_package/build_pip_package /tmp/tf39_wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: tensorflow-wheel-python39
          path: /tmp/tf39_wheel/*.whl
